<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Methods Demo</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- Internal CSS -->
  <style>
    p { color: blue; font-size: 18px; }
  </style>
</head>
<body>
  <h1>External CSS: this heading is styled by styles.css</h1>

  <p>Internal CSS: this paragraph is styled by the style tag.</p>

  <p style="color: red; font-size: 20px;">
    Inline CSS: this paragraph is styled by its own style attribute.
  </p>
</body>
</html>
